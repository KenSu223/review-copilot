services:
  grobid:
    image: grobid/grobid:0.9.1-crf   # native arm64 + amd64; ~500MB
    container_name: rc-grobid
    ports:
      - "8070:8070"
    init: true
    ulimits:
      core: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

[project]
name = "review-copilot"
version = "0.1.0"
description = "Socratic, judgment-preserving review copilot (ACL demo prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.24",
    "httpx>=0.27",
    "lxml>=5.0",
    "pymupdf>=1.26",
    "python-multipart>=0.0.9",
    "anthropic[bedrock]>=2.1",
    "boto3>=1.40",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]
